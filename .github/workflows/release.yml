name: Release

# Push a tag that matches the version in package.json, for example:
#   git tag v0.1.0 && git push origin v0.1.0
# A tag with a suffix such as v0.2.0-beta.1 becomes a pre-release.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Check that the tag matches package.json
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:TAG -ne "v$version") { throw "Tag $env:TAG does not match package.json version $version." }

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      # Builds dist/ and runs the checks.
      - run: npm test

      # The zip holds what the installer and the server need, with the built editor in dist/.
      # Without a .git folder, install.cmd only installs the runtime packages and skips the build.
      - name: Package
        run: |
          $name = "pixelbench-$env:TAG"
          $folder = Join-Path release 'pixelbench'
          New-Item -ItemType Directory -Force $folder | Out-Null
          $items = 'dist', 'server', 'scripts', 'profiles', 'workflows', 'docs',
            'install.cmd', 'install.ps1', 'Pixelbench.cmd', 'package.json', 'package-lock.json', 'README.md', 'CHANGELOG.md', 'LICENSE'
          foreach ($item in $items) { Copy-Item -Recurse $item $folder }
          # The bridge shares the prompt weight parser with the editor and imports it from src/.
          New-Item -ItemType Directory -Force "$folder/src/editor" | Out-Null
          Copy-Item src/editor/promptWeights.ts "$folder/src/editor/"
          # The in-app update replaces exactly these files and removes those an older release listed but this one does not.
          $base = (Resolve-Path $folder).Path
          $files = Get-ChildItem -Recurse -File $folder |
            ForEach-Object { $_.FullName.Substring($base.Length + 1).Replace('\', '/') } | Sort-Object
          [ordered]@{ version = $env:TAG.Substring(1); files = @($files) } | ConvertTo-Json -Depth 3 |
            Set-Content -Encoding utf8NoBOM "$folder/release.json"
          Compress-Archive -Path $folder -DestinationPath "release/$name.zip"
          "ZIP=release/$name.zip" >> $env:GITHUB_ENV

      # Unpacks the zip like a user would and checks that the server starts and serves the editor.
      - name: Smoke test the package
        run: |
          Expand-Archive $env:ZIP smoke
          Push-Location smoke/pixelbench
          $manifest = Get-Content release.json -Raw | ConvertFrom-Json
          if ($manifest.version -ne $env:TAG.Substring(1) -or $manifest.files -notcontains 'scripts/update.mjs') {
            throw 'release.json is missing or incomplete.'
          }
          npm ci --omit=dev --no-audit --no-fund
          $env:PIXELBENCH_PORT = '3799'
          $env:PIXELBENCH_STATE = (New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/state").FullName
          $server = Start-Process node -ArgumentList 'server/index.mjs' -PassThru -NoNewWindow
          try {
            $page = $null
            for ($i = 0; $i -lt 30 -and -not $page; $i++) {
              Start-Sleep 1
              try { $page = Invoke-WebRequest http://127.0.0.1:3799/ -UseBasicParsing } catch {}
            }
            if (-not $page -or $page.Content -notmatch '<title>Pixelbench') { throw 'The packaged server did not serve the editor.' }
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
            Pop-Location
          }

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $flags = @('--generate-notes', '--title', "Pixelbench $env:TAG")
          # The section of this version in CHANGELOG.md comes first, GitHub's generated notes follow.
          $version = [regex]::Escape($env:TAG.Substring(1))
          $section = [regex]::Match((Get-Content CHANGELOG.md -Raw), "(?ms)^## \[$version\][^\n]*\n(.*?)(?=^## \[|^\[[^\]]+\]: |\z)")
          if ($section.Success) {
            Set-Content -Encoding utf8NoBOM "$env:RUNNER_TEMP/notes.md" $section.Groups[1].Value.Trim()
            $flags += @('--notes-file', "$env:RUNNER_TEMP/notes.md")
          }
          if ($env:TAG.Contains('-')) { $flags += '--prerelease' }
          gh release create $env:TAG $env:ZIP @flags
